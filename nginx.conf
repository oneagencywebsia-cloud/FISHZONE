worker_processes auto;
worker_rlimit_nofile 65535;
events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    reset_timedout_connection on;
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;
    server_tokens off;

    types_hash_max_size 2048;
    client_max_body_size 1m;

    open_file_cache          max=10000 inactive=60s;
    open_file_cache_valid    120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    gzip on;
    gzip_vary on;
    gzip_static on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/xml application/json
        application/rss+xml application/atom+xml
        application/manifest+json application/ld+json
        image/svg+xml font/ttf font/otf;

    limit_req_zone $binary_remote_addr zone=general:10m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    map $sent_http_content_type $expires_map {
        default                    off;
        text/html                  epoch;
        text/css                   max;
        application/javascript     max;
        ~image/                    max;
        ~font/                     max;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        limit_req zone=general burst=100 nodelay;
        limit_conn addr 20;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

        location = / {
            add_header Cache-Control "public, max-age=300, must-revalidate" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), interest-cohort=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
        }
        location = /index.html {
            add_header Cache-Control "public, max-age=300, must-revalidate" always;
        }

        location ~* \.(png|jpg|jpeg|gif|webp|avif|svg|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000" always;
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
            try_files $uri =404;
        }
        location ~* \.(woff|woff2|ttf|otf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000" always;
            add_header Access-Control-Allow-Origin "*" always;
            access_log off;
            try_files $uri =404;
        }
        location ~* \.(css|js|mjs)$ {
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000" always;
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
            try_files $uri =404;
        }

        location = /robots.txt { add_header Cache-Control "public, max-age=86400" always; }
        location = /sitemap.xml { add_header Cache-Control "public, max-age=86400" always; add_header Content-Type "application/xml" always; }
        location = /favicon.ico { access_log off; log_not_found off; expires 1y; add_header Cache-Control "public, immutable, max-age=31536000" always; }

        location ~ /\.(?!well-known) { deny all; access_log off; log_not_found off; }
        location ~* \.(env|git|gitignore|htaccess|htpasswd|ini|log|sh|sql|bak|swp|swo|config|dockerfile|yml|yaml|lock|json)$ { deny all; access_log off; log_not_found off; }
        location ~* /(wp-admin|wp-login|xmlrpc|administrator|phpmyadmin) { deny all; access_log off; log_not_found off; }

        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }

        location / { try_files $uri $uri/ =404; }

        error_page 404 /index.html;
        error_page 500 502 503 504 /index.html;
    }
}
