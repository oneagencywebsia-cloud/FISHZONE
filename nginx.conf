worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # IP real del visitante: el proxy de EasyPanel (Traefik) añade la IP en X-Forwarded-For.
    # Solo se confía en redes privadas, así un cliente no puede falsear su IP.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Límites del servicio de capturas (subidas, API pública y panel de administración).
    limit_req_zone $binary_remote_addr zone=fz_up:10m rate=6r/m;
    limit_req_zone $binary_remote_addr zone=fz_api:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=fz_admin:10m rate=30r/m;
    map $http_x_forwarded_proto $fz_proto { default $http_x_forwarded_proto; '' $scheme; }

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml application/json image/svg+xml font/ttf font/otf;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;

        # Detrás del proxy de EasyPanel nginx solo ve HTTP: con redirects absolutos el
        # Location saldría como http://... Con redirects relativos el cliente conserva https.
        absolute_redirect off;
        index index.html;

        # NOTA nginx: si un `location` define cualquier `add_header`, deja de heredar
        # los `add_header` del nivel `server`. Por eso los headers de seguridad se
        # repiten en CADA bloque que añade su propio header (Cache-Control, etc.).
        # El `location /` final no añade headers, así que sí hereda los del server.

        location = / {
            add_header Cache-Control "public, max-age=300, must-revalidate";
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
        }
        location = /index.html {
            add_header Cache-Control "public, max-age=300, must-revalidate";
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
        }

        location ~* \.(png|jpg|jpeg|gif|webp|svg|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }
        location ~* \.(woff|woff2|ttf|otf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }
        location ~* \.(css|js)$ {
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }
        location ~* \.webmanifest$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Post retirado y reescrito (normativa del siluro): 301 a la URL nueva.
        location = /blog/mejor-mes-para-el-siluro-en-cordoba.html {
            return 301 https://fishzone.es/blog/que-hacer-si-pescas-un-siluro.html;
        }

        location = /robots.txt {
            add_header Cache-Control "public, max-age=86400";
            add_header X-Content-Type-Options "nosniff" always;
        }
        location = /sitemap.xml {
            # Un solo Content-Type: application/xml. (Antes se añadía con add_header
            # encima del text/xml de mime.types y la respuesta salía con dos cabeceras.)
            types { application/xml xml; }
            add_header Cache-Control "public, max-age=86400";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ───────── Capturas de la comunidad (servicio Node en 127.0.0.1:3000) ─────────
        # Si el servicio estuviera caído solo fallan estas rutas; el resto del sitio sigue estático.
        # Estas locations no definen add_header: heredan las cabeceras de seguridad del server.
        location = /capturas { return 301 /capturas/; }
        location = /capturas/enviar {
            limit_req zone=fz_up burst=2 nodelay;
            limit_req_status 429;
            client_max_body_size 10m;
            client_body_timeout 30s;
            proxy_pass http://127.0.0.1:3000;
            include /etc/nginx/fz-proxy.conf;
        }
        location ^~ /capturas/ {
            proxy_pass http://127.0.0.1:3000;
            include /etc/nginx/fz-proxy.conf;
        }
        location ^~ /api/ {
            limit_req zone=fz_api burst=30 nodelay;
            client_max_body_size 1k;
            proxy_pass http://127.0.0.1:3000;
            include /etc/nginx/fz-proxy.conf;
        }
        location ^~ /admin/ {
            limit_req zone=fz_admin burst=15 nodelay;
            client_max_body_size 32k;
            proxy_pass http://127.0.0.1:3000;
            include /etc/nginx/fz-proxy.conf;
        }
        location = /sitemap-capturas.xml {
            proxy_pass http://127.0.0.1:3000;
            include /etc/nginx/fz-proxy.conf;
        }
        # Fotos ya aprobadas (nunca las pendientes): nombre único => caché inmutable.
        location ^~ /u/ {
            alias /data/public/;
            add_header Cache-Control "public, immutable, max-age=31536000";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            access_log off;
        }

        # Página 404 propia (con enlaces a las guías principales).
        error_page 404 /404.html;
        location = /404.html { internal; }

        # URL sin extensión (/pesca-en-cordoba): 301 a la versión .html si existe;
        # si es un directorio (/blog) lo manda a /blog/. Si no existe nada, 404.
        location ~ ^/(?<slug>[a-z0-9-]+(?:/[a-z0-9-]+)?)$ {
            if (-f $document_root/$slug.html) { return 301 /$slug.html; }
            if (-d $document_root/$slug) { return 301 /$slug/; }
            return 404;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        # Heredados por `location /` (no define add_header propio).
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
    }
}
